name: iOS Tests

on:
  workflow_call:
    secrets:
      DEMO_LOGIN_USERNAME:
        required: true
      DEMO_LOGIN_PASSWORD:
        required: true

jobs:
  ios-integration-tests:
    name: iOS Integration Tests
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Select stable Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Flutter analyzer
        run: flutter analyze

      - name: Prepare iOS project
        run: flutter build ios --simulator --config-only

      - name: Validate iOS release build
        run: flutter build ios --release --no-codesign

      - name: Clean previous reports
        run: |
          rm -rf test_reports test_reports_ios
          rm -f test_results.json ios_test_results.json ios_test_verbose.log
          mkdir -p test_reports test_reports_ios

      - name: Create iPhone Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail

          RUNTIME_ID="$(
            xcrun simctl list runtimes available |
            awk '/iOS 18\.5/ { print $NF; exit }'
          )"

          if [ -z "$RUNTIME_ID" ]; then
            echo "The iOS 18.5 simulator runtime is unavailable."
            xcrun simctl list runtimes available
            exit 1
          fi

          DEVICE_ID="$(
            xcrun simctl create \
              "Task Manager CI" \
              "com.apple.CoreSimulator.SimDeviceType.iPhone-16" \
              "$RUNTIME_ID"
          )"

          echo "Created iPhone 16 / iOS 18.5 simulator: $DEVICE_ID"
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Run iOS integration tests
        timeout-minutes: 22
        shell: bash
        env:
          DEMO_LOGIN_USERNAME: ${{ secrets.DEMO_LOGIN_USERNAME }}
          DEMO_LOGIN_PASSWORD: ${{ secrets.DEMO_LOGIN_PASSWORD }}
        run: bash scripts/ci/run_ios_tests.sh "${{ steps.simulator.outputs.device_id }}"

      - name: Generate iOS HTML report
        if: always()
        env:
          TEST_PLATFORM: iOS
        run: |
          rm -rf test_reports
          mkdir -p test_reports

          if [ -s ios_test_results.json ] && [ -f scripts/test_reporting/generate_report.py ]; then
            cp ios_test_results.json test_reports/test_results.json
            python3 scripts/test_reporting/generate_report.py
            cp -R test_reports/. test_reports_ios/
          else
            echo "iOS test results or report generator not found."
            {
              echo "## iOS integration tests"
              echo
              echo "### ❌ Overall result: FAILED"
              echo
              echo "No machine-readable test results were produced. Check the iOS job log for the startup or infrastructure failure."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload iOS HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-html-report
          path: test_reports_ios/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload iOS test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            ios_test_results.json
            ios_test_verbose.log
            ios_diagnostics/
          if-no-files-found: warn
          retention-days: 14
